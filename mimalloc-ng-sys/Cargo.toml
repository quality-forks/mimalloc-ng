[package]
name                   = "mimalloc-ng-sys"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Raw bindings to mimalloc, built from vendored source"
readme                 = "../README.md"
repository.workspace   = true
license.workspace      = true
keywords               = [ "allocator", "ffi", "malloc", "mimalloc" ]
categories             = [ "external-ffi-bindings", "memory-management", "no-std" ]
links                  = "mimalloc"
include                = [
  "build.rs",
  "mimalloc/LICENSE",
  "mimalloc/include",
  "mimalloc/src",
  "src"
]

[dev-dependencies]
libc = { version = "0.2.186", default-features = false }

[build-dependencies]
cc = "1.2.60"

[features]
default              = [ "profiler" ]
debug                = []
free_use_pagemap     = []
local_dynamic_tls    = []
override             = []
profiler             = []
secure               = []
skip_collect_on_exit = []
win_direct_tls       = []

[lints]
workspace = true
